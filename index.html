<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>练习目录</title>
  <style>
    :root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#252b36;background:#f7f7f8}*{box-sizing:border-box}body{margin:0}button,a{font:inherit}button{cursor:pointer}.wrap{max-width:1440px;margin:auto;padding:28px 22px 56px}header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.heading-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}h1{margin:0;font-size:32px;letter-spacing:.02em}.favorites-open{border:1px solid #d3d5d8;border-radius:8px;background:white;color:#a72c35;padding:6px 12px;font-size:14px}.subtitle{margin:6px 0 0;color:#697180;font-size:14px}.tabs{display:flex;gap:5px;background:#e9eaed;padding:4px;border-radius:11px}.tab{border:0;border-radius:8px;padding:8px 24px;background:transparent;color:#626b78;font-weight:650}.tab.active{background:white;color:#a72c35;box-shadow:0 1px 5px #17243b18}.books{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.book{--accent:#e52e3d;background:var(--accent);border-radius:8px;padding:10px 8px 9px;box-shadow:0 2px 7px #1b243012}.book:nth-child(n+4){--accent:#292438}.book:nth-child(n+10){--accent:#4d455f}.book:nth-child(n+16){--accent:#675d72}.book-title{color:white;font-size:16px;font-weight:700;padding:1px 4px 9px;line-height:1.25}.book-title strong{font-size:24px;margin-left:9px}.tests{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.test{background:white;border-radius:5px;overflow:hidden;min-width:0;box-shadow:0 2px 5px #181d2a1b}.test-title{background:#0004;color:white;padding:5px 8px;font-size:12px}.parts{padding:6px 0}.parts a{display:block;color:#2e5369;text-decoration:none;padding:5px 9px;font-size:13px;line-height:1.45}.parts a:hover,.parts a:focus-visible{background:#eef1f4;color:#aa2934;outline:0}.parts a.available{font-weight:700;color:#b12c38}.parts a.available:after{content:"●";font-size:8px;margin-left:6px;vertical-align:middle}.favorites-dialog{border:0;border-radius:13px;width:min(560px,calc(100vw - 24px));max-height:78vh;padding:0;background:white;box-shadow:0 15px 60px #1c26373b}.favorites-dialog::backdrop{background:#151c2a88}.dialog-head{padding:17px 20px;border-bottom:1px solid #e2e3e6;display:flex;align-items:center;justify-content:space-between}.dialog-head h2{font-size:21px;margin:0}.dialog-head button{font-size:26px;border:0;background:transparent;color:#68717c}.favorite-list{padding:12px 20px 22px;overflow:auto;max-height:65vh}.favorite-row{display:flex;align-items:center;gap:12px;border-bottom:1px solid #ececef;padding:10px 0}.favorite-reveal{flex:1;text-align:left;border:0;background:transparent;color:#273849;padding:3px;min-width:0}.favorite-reveal strong,.favorite-reveal span{display:block}.favorite-reveal span{font-size:13px;color:#697180}.favorite-star{border:0;background:transparent;color:#bd7b1d;font-size:22px;padding:3px}.empty-favorites{color:#697180;text-align:center;padding:30px 5px}@media(max-width:1000px){.books{grid-template-columns:1fr}}@media(max-width:580px){.wrap{padding:19px 12px 42px}header{align-items:start;display:block}h1{font-size:27px}.tabs{margin-top:18px;width:max-content}.tests{grid-template-columns:repeat(2,minmax(0,1fr))}.book{padding:9px 7px}.book-title{font-size:14px}.book-title strong{font-size:21px}}
  .home-contact{display:flex;justify-content:flex-end;margin-bottom:14px;font-size:13px}.home-contact a{color:#697180;text-decoration:none}.home-contact a:hover{text-decoration:underline;color:#a72c35}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="home-contact"><a href="mailto:2105223584@qq.com" title="欢迎指出问题，建议">联系我</a></div>
    <header><div><div class="heading-row"><h1>练习目录</h1><button type="button" class="favorites-open" id="open-favorites">★ 收藏词汇</button></div><p class="subtitle">选择册数、Test 和 Part</p></div><nav class="tabs" aria-label="练习类型"><button type="button" class="tab active" data-mode="listening" aria-pressed="true">听力</button><button type="button" class="tab" data-mode="reading" aria-pressed="false">阅读</button></nav></header>
    <div id="books" class="books"></div>
  </main>
  <dialog class="favorites-dialog" id="favorites-dialog" aria-labelledby="favorites-title"><div class="dialog-head"><h2 id="favorites-title">收藏的词汇</h2><button type="button" id="close-favorites" aria-label="关闭">×</button></div><div class="favorite-list" id="favorite-list"></div></dialog>
  <script src="core-vocab.js"></script>
  <script src="exercise-catalog.js"></script>
  <script>
    const books=document.querySelector('#books');let mode='listening';
    function render(){books.replaceChildren();for(let book=21;book>=4;book--){const group=document.createElement('section');group.className='book';const title=document.createElement('div');title.className='book-title';title.innerHTML=`${mode==='listening'?'LISTENING':'READING'} &nbsp; Academic <strong>${book}</strong>`;group.append(title);const tests=document.createElement('div');tests.className='tests';for(let test=1;test<=4;test++){const panel=document.createElement('div');panel.className='test';const head=document.createElement('div');head.className='test-title';head.textContent=`Test ${test}`;const links=document.createElement('div');links.className='parts';const count=mode==='listening'?4:3;for(let part=1;part<=count;part++){const link=document.createElement('a');link.href=`select.html?mode=${mode}&book=${book}&test=${test}&part=${part}`;link.textContent=`${mode==='listening'?'Part':'Passage'} ${part}`;if(RRExerciseCatalog.some(entry=>entry.mode===mode&&entry.book===book&&entry.test===test&&entry.part===part))link.className='available';links.append(link)}panel.append(head,links);tests.append(panel)}group.append(tests);books.append(group)}}
    document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{mode=tab.dataset.mode;document.querySelectorAll('.tab').forEach(item=>{const on=item===tab;item.classList.toggle('active',on);item.setAttribute('aria-pressed',String(on))});render()}));
    function renderFavorites(){const box=document.querySelector('#favorite-list');box.replaceChildren();const favorites=RRVocab.getFavorites();if(!favorites.length){const empty=document.createElement('div');empty.className='empty-favorites';empty.textContent='还没有收藏的词汇。';box.append(empty);return}favorites.forEach(word=>{const row=document.createElement('div');row.className='favorite-row';const reveal=document.createElement('button');reveal.type='button';reveal.className='favorite-reveal';reveal.setAttribute('aria-expanded','false');const english=document.createElement('strong');english.textContent=word.english;const chinese=document.createElement('span');chinese.textContent='点击显示意思';reveal.append(english,chinese);reveal.addEventListener('click',()=>{const shown=reveal.getAttribute('aria-expanded')==='true';reveal.setAttribute('aria-expanded',String(!shown));chinese.textContent=shown?'点击显示意思':word.chinese});const star=document.createElement('button');star.type='button';star.className='favorite-star';star.textContent='★';star.setAttribute('aria-label',`取消收藏 ${word.english}`);star.addEventListener('click',()=>{RRVocab.toggleFavorite(word);renderFavorites()});row.append(reveal,star);box.append(row)})}
    document.querySelector('#open-favorites').addEventListener('click',()=>{renderFavorites();document.querySelector('#favorites-dialog').showModal()});document.querySelector('#close-favorites').addEventListener('click',()=>document.querySelector('#favorites-dialog').close());
    render();
  </script>
</body></html>
